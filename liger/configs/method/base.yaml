include_user_id: False
use_id: "sid"

# Hybrid generative-prefix + dense retrieval options
# use_extra_sid: if True, append an extra (4th) sid to avoid sid collisions
#                 (original liger behaviour). If False, keep only the 3 RQ-VAE
#                 codebooks and rely on dense retrieval to disambiguate.
use_extra_sid: True
# prefix_depth: number of leading sids the generative model is trained to predict.
#               0 means "predict all n_codebook sids" (backward compatible).
#               Set to 2 or 3 for the hybrid method (generative prefix -> dense).
prefix_depth: 0
# input_sid_depth: number of SID layers used to represent each input item in the
#                  encoder sequence. 0 (default) = use all n_codebook SIDs per
#                  item (backward compatible). A positive integer N truncates
#                  each input item to its first N SIDs, shortening the encoder
#                  sequence and discarding fine-grained quantization noise.
#                  Typically set equal to prefix_depth so the encoder only sees
#                  the SIDs it is trained to predict.
input_sid_depth: 0
# dense_loss_mode: how the MAIN dense retrieval loss picks negatives.
#   "full"      (default, liger original): full-library softmax over all seen
#                items. Strong global signal, ~500MB-1GB activation per step.
#   "in_batch"  (ablation): only the B target items in the batch are projected;
#                positives = own target, negatives = other B-1 batch targets.
#                Much cheaper, weaker signal. Used for the liger in-batch ablation.
#   "bucket"    (hybrid ablation): only items in the target's prefix bucket.
#                Train/eval-aligned but weak negatives.
# An auxiliary bucket CE (bucket_loss_weight) can be added on top of any mode —
# see hybrid.yaml for details.
dense_loss_mode: "full"

# model training
flag_add_input_embedding: False
flag_use_output_embedding: False

embedding_loss_weight: 0
sid_loss_weight: 1

evaluation_method: "default"

embedding_head_dict:
  use_new_init: False
  embed_target: ground_truth
  embed_proj_type: mlp

