defaults:
  - base

# Hybrid generative-prefix + dense retrieval method.
#
# The generative (T5) model is only trained to autoregressively predict the
# first `prefix_depth` semantic ids (the "prefix"). After the prefix is
# generated, a dense retriever ranks the candidate items that fall under that
# prefix (prefix -> item-set mapping).
#
# Unlike the original liger method, we do NOT append an extra sid to resolve sid
# collisions: collisions inside a prefix bucket are resolved by the dense
# retriever instead.
flag_add_input_embedding: True
flag_use_output_embedding: True

embedding_loss_weight: 1
sid_loss_weight: 1

# "hybrid" = generate prefix, then dense-retrieve within the prefix bucket.
evaluation_method: "hybrid"

# Do not add the extra (4th) conflict-resolution sid: keep the 3 RQ-VAE codebooks.
use_extra_sid: False
# The generative model only predicts the first `prefix_depth` sids.
# Valid values: 2 or 3 (must be <= n_semantic_codebook).
prefix_depth: 2
# Number of beam prefixes generated per sample at evaluation time; the dense
# retriever ranks the union of their prefix buckets. Larger -> denser retrieval
# has a bigger candidate pool to rank (closer to the liger 100-candidate setup).
hybrid_num_candidates: 100
# Dense loss negative sampling:
#   "full"   (default, liger-style): project every seen item, softmax over the
#            whole library. Strong retrieval signal, ~500MB-1GB activation per
#            step. Use this when dense quality matters more than speed.
#   "bucket" (ablation): only rank items inside the target's prefix bucket.
#            Fast and train/eval-aligned, but weak negatives -> dense head under-
#            trains. Kept for experiments.
dense_loss_mode: "full"
# Auxiliary bucket contrastive loss weight. On top of the full-library dense
# loss, adds a bucket-only CE that aligns the dense head with the evaluation
# candidate set (eval ranks items inside the target's prefix bucket). Set to 0
# to disable; set to 1.0 to give it equal weight with the full-library loss.
# Check `train/bucket_loss` vs `train/embedding_loss` on wandb to tune.
bucket_loss_weight: 0.0

# Similarity metric for dense retrieval (training + evaluation):
#   "cosine" (default) — L2-normalize both predicted and item embeddings,
#                         then dot-product ÷ temperature. Standard contrastive.
#   "dot"              — raw dot-product ÷ temperature, no normalization.
#                         Preserves embedding norm as signal; useful when item
#                         embeddings come from dot-product-trained models (e.g.
#                         SASRec CF embeddings).
similarity_metric: "cosine"

embedding_head_dict:
  normalize_logits: True  # flag_use_output_embedding: True
  logits_temperature: 0.07  # flag_use_output_embedding: True

  text_embedding_dim: 768  # flag_add_input_embedding: True
  hidden_sizes: [256, 512, 768]  # flag_add_input_embedding: True
  embd_proj_dropout_rate: 0.5  # flag_add_input_embedding: True
  embd_proj_in_dropout_rate: 0.2  # flag_add_input_embedding: True
